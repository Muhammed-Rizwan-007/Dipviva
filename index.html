<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Dipviva</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
    }

    header {
      background: #1f2937;
      color: white;
      padding: 18px;
      text-align: center;
    }

    header h1 {
      margin-bottom: 6px;
    }

    .container {
      width: 95%;
      max-width: 1200px;
      margin: 20px auto;
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }

    .btn {
      padding: 11px 18px;
      border-radius: 7px;
      text-decoration: none;
      font-weight: bold;
    }

    .download {
      background: #2563eb;
      color: white;
    }

    .open {
      background: #e5e7eb;
      color: #111;
    }

    .pdf-viewer {
      width: 100%;
      height: 80vh;
      background: white;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>

<body>



  <main class="container">

    <div class="actions">

      <a
        class="btn download"
        href="Diplabviva.pdf"
        download>
        Download PDF
      </a>

      <a
        class="btn open"
        href="Diplabviva.pdf"
        target="_blank">
        Open PDF in New Tab
      </a>

    </div>

    <div class="pdf-viewer">

      <iframe
        src="Diplabviva.pdf"
        title="R Lab Programs PDF">
      </iframe>

    </div>

  </main>-

</body>
</html>
